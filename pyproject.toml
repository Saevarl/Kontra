[build-system]
requires = ["setuptools>=77.0.3,<85", "wheel>=0.45,<0.49"]
build-backend = "setuptools.build_meta"

[project]
name = "kontra"
version = "0.15.0"
description = "Developer-first data quality engine"
readme = "README.md"
authors = [{ name = "Saevarlb" }]
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["data-quality", "validation", "data-contracts", "data-profiling", "mcp", "polars", "duckdb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "polars>=1.34,<2",
    "duckdb>=1.4,<2",
    "pydantic>=2.11,<3",
    "typer>=0.19,<0.28",
    "rich>=13.9,<16",
    "pyarrow>=20,<26",
    "pyyaml>=6.0.2,<7",
    "sqlglot>=28,<31",
]

[project.urls]
Homepage = "https://kontrakit.io/"
Documentation = "https://kontrakit.dev/"
Repository = "https://github.com/Saevarl/Kontra"
Issues = "https://github.com/Saevarl/Kontra/issues"

[project.scripts]
kontra = "kontra.cli.main:main"
kontra-mcp = "kontra.mcp.cli:main"

[project.optional-dependencies]
s3 = ["s3fs>=2025.3"]
postgres = ["psycopg[binary]>=3.2,<4"]
# MCP 2 renames FastMCP and changes transports and return types.
mcp = ["mcp>=1.30,<2"]
mcp-postgres = ["mcp>=1.30,<2", "psycopg[binary]>=3.2,<4"]
sqlserver = ["pymssql>=2.3,<3"]
# Entra ID (Azure AD) auth for Azure SQL / Managed Instance. Requires a
# Microsoft ODBC driver (msodbcsql18) installed on the host. On Linux/macOS the
# driver acquires the token via the Authentication=ActiveDirectory* keywords. On
# Windows those keywords are unsupported, so azure-identity is used to acquire an
# access token that is passed to the driver via pyodbc attrs_before.
sqlserver-entra = ["pyodbc>=5.2,<6", "azure-identity>=1.23,<2"]
# ClickHouse: HTTP client for the columnar OLAP store.
clickhouse = ["clickhouse-connect>=1.0,<2"]
# Trino: DBAPI client for the distributed SQL engine (Iceberg, Hive, ...).
trino = ["trino>=0.330,<1"]
all = [
    "s3fs>=2025.3",
    "psycopg[binary]>=3.2,<4",
    "pymssql>=2.3,<3",
    "pyodbc>=5.2,<6",
    "azure-identity>=1.23,<2",
    "clickhouse-connect>=1.0,<2",
    "trino>=0.330,<1",
]
dev = [
    "pytest>=8.4,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<0.17",
    # Required by conftest and pandas/MCP tests; [all] is backend-only.
    "numpy>=2.2,<3",
    "pandas>=2.2,<3; python_version < '3.11'",
    "pandas>=2.2,<4; python_version >= '3.11'",
    "mcp>=1.30,<2",
    "build>=1.2,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["kontra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
